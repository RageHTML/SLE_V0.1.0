services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DATABASE_NAME:-Logistica}
      MYSQL_USER: ${DATABASE_USER:-dono}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-12345678}
    volumes:
      - ./docker/database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend_container
    volumes:
      - ./apps/backend:/docker/backend
    environment:
        - DEBUG=${DEBUG:-True}
        - SECRET_KEY=${SECRET_KEY:-your_secret_key}
        - DATABASE_NAME=${DATABASE_NAME:-Logistica}
        - DATABASE_USER=${DATABASE_USER:-dono}
        - DATABASE_PASSWORD=${DATABASE_PASSWORD:-12345678}
        - DATABASE_HOST=mysql
        - DATABASE_PORT=${DATABASE_PORT:-3306}
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend_container
    volumes:
      - ./docker/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
      
